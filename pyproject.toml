[project]
name = "everwrap"
version = "0.0.1"
description = "Local privacy boundary for Evernote MCP — synthetic feasibility study"
requires-python = ">=3.12,<3.14"
dependencies = [
    "en-core-web-lg",
    "presidio-analyzer",
    "presidio-anonymizer",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
